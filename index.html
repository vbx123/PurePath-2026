<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة فرح تفاعلية ملكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #7c5c43;
            --secondary-color: #bfa38a;
            --bg-color: #fcf9f5;
            --text-color: #333333;
            --card-bg: #ffffff;
            --accent-color: #d4af37;
            --input-bg: #faf7f2;
        }

        /* ألوان الوضع الليلي السحرية */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #d4af37;
            --secondary-color: #aa9070;
            --input-bg: #2d2d2d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.4s, color 0.4s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Reem Kufi', 'Cairo', sans-serif;
            font-weight: 700;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* أزرار التحكم الطائرة (موسيقى + ثيم) */
        .floating-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2000;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50px;
            background: var(--card-bg);
            border: 1px solid var(--secondary-color);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .music-playing {
            animation: spin 4s linear infinite;
        }

        /* تساقط الورد */
        .petal {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            font-size: 1.5rem;
            animation: fall linear forwards;
        }

        /* كروت الأنميشن المخفية افتراضياً */
        .animate-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }

        .animate-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* الهيرو الرئيسي */
        .hero-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(124, 92, 67, 0.15);
        }

        .hero-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
        }

        .hero-content {
            padding: 30px 20px;
        }

        .event-badge {
            display: inline-block;
            background: var(--secondary-color);
            color: white;
            padding: 4px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .names-wrapper {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .names-wrapper i {
            color: #e04f5f;
            animation: pulse 1.5s infinite;
        }

        /* العداد التنازلي */
        .countdown-section {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .timer {
            display: flex;
            justify-content: space-around;
            direction: ltr;
            margin-top: 10px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
            width: 65px;
        }

        .time-num {
            font-size: 1.4rem;
            font-weight: bold;
            display: block;
        }

        .time-label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        /* الكروت القياسية */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid rgba(124, 92, 67, 0.08);
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px dashed rgba(191, 163, 138, 0.3);
            padding-bottom: 10px;
        }

        .greetings-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .greeting-item {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 15px;
            border-right: 4px solid var(--secondary-color);
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-icon {
            background: var(--input-bg);
            color: var(--primary-color);
            width: 45px;
            height: 45px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .btn-general {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .btn-whatsapp {
            background: #25D366;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
            font-size: 1rem;
            font-weight: bold;
        }

        /* معرض الصور */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery-grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
        }

        /* نظام نافذة تكبير الصور (Lightbox) */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 20px; right: 20px;
            color: white; font-size: 2rem; cursor: pointer;
        }

        /* التعليقات */
        .comment-item {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 15px 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .comment-name {
            font-weight: bold;
            color: var(--primary-color);
        }

        .comment-badge {
            font-size: 0.75rem;
            background: var(--input-bg);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* بار التلجرام الثابت */
        .telegram-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--card-bg);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.08);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            max-width: 600px;
            margin: 0 auto;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border: 1px solid rgba(124, 92, 67, 0.15);
        }

        .code-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .btn-telegram {
            background: #24A1DE;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        /* الأنميشنز */
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="floating-controls">
        <button class="control-btn" id="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button class="control-btn" id="music-toggle" onclick="toggleMusic()" title="تشغيل/كتم الصوت">
            <i class="fa-solid fa-music"></i>
        </button>
    </div>

    <audio id="bg-audio" loop></audio>

    <div class="container">
        <section class="hero-card animate-scroll">
            <img id="hero-img" src="" alt="صورة المناسبة" class="hero-img">
            <div class="hero-content">
                <span id="event-badge" class="event-badge"></span>
                <h1 id="hero-title" style="font-size: 1.2rem; opacity: 0.7;"></h1>
                <div class="names-wrapper">
                    <span id="groom-name"></span>
                    <i class="fa-solid fa-heart"></i>
                    <span id="bride-name"></span>
                </div>
                <p id="welcome-message" style="opacity: 0.8; font-size: 0.95rem;"></p>
            </div>
        </section>

        <section class="countdown-section animate-scroll">
            <p><i class="fa-regular fa-clock"></i> المتبقي على ليلة العمر</p>
            <div class="timer">
                <div class="time-box"><span id="days" class="time-num">00</span><span class="time-label">أيام</span></div>
                <div class="time-box"><span id="hours" class="time-num">00</span><span class="time-label">ساعات</span></div>
                <div class="time-box"><span id="minutes" class="time-num">00</span><span class="time-label">دقائق</span></div>
                <div class="time-box"><span id="seconds" class="time-num">00</span><span class="time-label">ثواني</span></div>
            </div>
        </section>

        <section class="card animate-scroll">
            <h3 class="section-title"><i class="fa-solid fa-share-nodes"></i> مشاركة الفرحة</h3>
            <p style="font-size: 0.9rem; margin-bottom: 12px; opacity: 0.8;">شارك هذه الدعوة الأنيقة مع أحبابك وأصدقائك عبر الواتساب مباشرة:</p>
            <button class="btn-general btn-whatsapp" onclick="shareOnWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> إرسال الدعوة عبر واتساب
            </button>
        </section>

        <section class="card animate-scroll">
            <h3 class="section-title"><i class="fa-solid fa-dove"></i> كلمة أهل العروسين</h3>
            <div id="family-greetings-container" class="greetings-grid"></div>
        </section>

        <section class="card animate-scroll">
            <h3 class="section-title"><i class="fa-regular fa-calendar-check"></i> تفاصيل الحفل</h3>
            <div class="info-row">
                <div class="info-icon"><i class="fa-regular fa-calendar"></i></div>
                <div>
                    <p style="font-weight: bold;">التاريخ</p>
                    <p id="event-date" style="font-size: 0.9rem; opacity: 0.8;"></p>
                </div>
            </div>
            <div class="info-row">
                <div class="info-icon"><i class="fa-regular fa-clock"></i></div>
                <div>
                    <p style="font-weight: bold;">الوقت</p>
                    <p id="event-time" style="font-size: 0.9rem; opacity: 0.8;"></p>
                </div>
            </div>
            <div class="info-row">
                <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div>
                    <p style="font-weight: bold;">المكان</p>
                    <p id="venue-name" style="font-size: 0.9rem; opacity: 0.9; font-weight: 500;"></p>
                    <p id="venue-address" style="font-size: 0.85rem; opacity: 0.7;"></p>
                    <a id="venue-map" href="#" target="_blank" class="btn-general"><i class="fa-solid fa-map-location-dot"></i> عرض على الخريطة</a>
                </div>
            </div>
        </section>

        <section class="card animate-scroll">
            <h3 class="section-title"><i class="fa-regular fa-images"></i> ألبوم الصور</h3>
            <div id="gallery-container" class="gallery-grid"></div>
        </section>

        <section class="card animate-scroll" style="margin-bottom: 40px;">
            <h3 class="section-title"><i class="fa-regular fa-comment-dots"></i> تبريكات المهنئين</h3>
            <div id="comments-container"></div>
        </section>
    </div>

    <div class="telegram-bar">
        <div class="code-box">
            <span style="font-size:0.85rem;">كود الدعوة:</span>
            <span id="event-code" style="font-weight:bold; font-family:monospace; font-size:1rem;">------</span>
            <button style="background:none; border:none; color:var(--secondary-color); cursor:pointer;" onclick="copyEventCode()"><i class="fa-regular fa-copy"></i></button>
        </div>
        <a id="tg-link" href="#" target="_blank" class="btn-telegram">
            <i class="fa-brands fa-telegram"></i> أرسل تهنئتك الآن
        </a>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        let whatsappShareText = "";

        // 1. جلب البيانات وتوزيعها ديناميكياً
        async function initPage() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();

                // الهيرو
                document.getElementById('hero-img').src = data.hero.main_image;
                document.getElementById('hero-title').innerText = data.hero.title;
                document.getElementById('groom-name').innerText = data.hero.groom_name;
                document.getElementById('bride-name').innerText = data.hero.bride_name;
                document.getElementById('welcome-message').innerText = data.hero.welcome_message;
                document.getElementById('event-badge').innerText = data.event_type === "wedding" ? "حفل زفاف" : "مناسبة سعيدة";

                // تجهيز نص الواتساب
                whatsappShareText = data.share_text_template;

                // الموسيقى
                document.getElementById('bg-audio').src = data.background_music_url;

                // تهنئة الأهل
                const greetingsContainer = document.getElementById('family-greetings-container');
                data.family_greetings.forEach(g => {
                    greetingsContainer.innerHTML += `
                        <div class="greeting-item">
                            <h4 style="color:var(--primary-color); margin-bottom:5px;">${g.side}</h4>
                            <p style="font-size:0.9rem; opacity:0.9;">${g.text}</p>
                        </div>`;
                });

                // الموعد والمكان
                document.getElementById('event-date').innerText = data.details.date_text;
                document.getElementById('event-time').innerText = data.details.time_text;
                document.getElementById('venue-name').innerText = data.details.venue_name;
                document.getElementById('venue-address').innerText = data.details.venue_address;
                document.getElementById('venue-map').href = data.details.venue_map_url;

                // ألبوم الصور مع تفعيل ميزة التكبير (Lightbox)
                const galleryContainer = document.getElementById('gallery-container');
                data.gallery.forEach(imgUrl => {
                    galleryContainer.innerHTML += `<img src="${imgUrl}" onclick="openLightbox('${imgUrl}')" alt="صورة الفرح">`;
                });

                // التعليقات
                const commentsContainer = document.getElementById('comments-container');
                data.congratulations.forEach(c => {
                    commentsContainer.innerHTML += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-name">${c.name}</span>
                                <span class="comment-badge">${c.relation}</span>
                            </div>
                            <p style="font-size:0.95rem; opacity:0.85;">${c.message}</p>
                        </div>`;
                });

                // أكواد التلجرام
                document.getElementById('event-code').innerText = data.event_code;
                document.getElementById('tg-link').href = data.telegram_bot_url;

                // تشغيل العداد والميزات البصرية
                initCountdown(data.details.date_iso);
                initAutoTheme();
                setInterval(createPetal, 400);
                initScrollAnimation();

            } catch (error) {
                console.error("حدث خطأ أثناء تحميل البيانات:", error);
            }
        }

        // 2. ميزة العداد التنازلي
        function initCountdown(dateString) {
            const target = new Date(dateString).getTime();
            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    document.querySelector('.countdown-section').innerHTML = "<p style='font-weight:bold; font-size:1.1rem;'>بدأت مراسم الفرحة والسرور الآن! 🎉</p>";
                    return;
                }

                document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('minutes').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById('seconds').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            }, 1000);
        }

        // 3. ميزة تساقط أوراق الورد والقلوب
        function createPetal() {
            const items = ['🌸', '❤️', '🌹', '✨'];
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.innerText = items[Math.floor(Math.random() * items.length)];
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 4 + 's';
            petal.style.opacity = Math.random() * 0.7 + 0.3;
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 7000);
        }

        // 4. ميزة التحكم في تشغيل الموسيقى الخلفية
        function toggleMusic() {
            const audio = document.getElementById('bg-audio');
            const icon = document.getElementById('music-toggle').querySelector('i');
            if (audio.paused) {
                audio.play().catch(e => alert("اضغط أولاً على أي مكان في الصفحة للسماح بتشغيل الصوت."));
                icon.classList.add('music-playing');
            } else {
                audio.pause();
                icon.classList.remove('music-playing');
            }
        }

        // 5. ميزة الوضع الليلي التلقائي واليدوي
        function initAutoTheme() {
            const hour = new Date().getHours();
            if (hour < 6 || hour > 18) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle').querySelector('i').className = "fa-solid fa-sun";
            }
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const icon = document.getElementById('theme-toggle').querySelector('i');
            if (current === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                icon.className = "fa-solid fa-moon";
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                icon.className = "fa-solid fa-sun";
            }
        }

        // 6. ميزة الأنميشن عند التمرير
        function initScrollAnimation() {
            const cards = document.querySelectorAll('.animate-scroll');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            cards.forEach(card => observer.observe(card));
        }

        // 7. ميزة مكبر الصور (Lightbox)
        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // 8. ميزة المشاركة عبر واتساب
        function shareOnWhatsApp() {
            const pageUrl = window.location.href;
            const fullMessage = encodeURIComponent(whatsappShareText + pageUrl);
            window.open(`https://api.whatsapp.com/send?text=${fullMessage}`, '_blank');
        }

        // 9. ميزة نسخ كود التحلجرام
        function copyEventCode() {
            const code = document.getElementById('event-code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('تم نسخ الكود بنجاح: ' + code + '\nانسخه الآن في محادثة البوت لإرسال تعليقك.');
            });
        }

        window.onload = initPage;
    </script>
</body>
    </html>
